name: Deploy (main)

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image prefix (Docker GHCR tags must be lowercase)
        id: image_prefix
        run: echo "value=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}-backend:main
            ${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}-backend:sha-${{ github.sha }}

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}-frontend:main
            ${{ env.REGISTRY }}/${{ steps.image_prefix.outputs.value }}-frontend:sha-${{ github.sha }}

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      # Те же имена секретов, что в других репозиториях: VPS_SSH_* (ключ в Base64).
      - name: Decode SSH key
        run: |
          install -d -m 700 "$HOME/.ssh"
          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 -d > "$HOME/.ssh/vps_deploy_key"
          chmod 600 "$HOME/.ssh/vps_deploy_key"

      - name: SSH deploy (docker compose pull + up)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key_path: /home/runner/.ssh/vps_deploy_key
          script: |
            set -e
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
