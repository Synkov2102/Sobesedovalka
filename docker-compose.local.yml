# Переменные: .env в корне репозитория (шаблон — .env.example).
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: sobesedovalka-backend:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      JWT_SECRET: ${JWT_SECRET:-local-dev-jwt-secret-min-32-chars!!}
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env — see .env.example}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      VK_REDIRECT_URI: ${VK_REDIRECT_URI:-http://localhost:8080}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI:-http://localhost:8080}
    ports:
      - "8081:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Если VITE_* не заданы в корневом .env — подставятся ID бэкенда (см. .env.example)
        VITE_VK_APP_ID: ${VITE_VK_APP_ID:-${VK_CLIENT_ID}}
        VITE_VK_REDIRECT_URI: ${VITE_VK_REDIRECT_URI:-http://localhost:8080}
        VITE_YANDEX_CLIENT_ID: ${VITE_YANDEX_CLIENT_ID:-${YANDEX_CLIENT_ID}}
        VITE_YANDEX_REDIRECT_URI: ${VITE_YANDEX_REDIRECT_URI:-http://localhost:8080}
        # Пусто — Socket.IO на том же origin (nginx проксирует /socket.io)
        VITE_COLLAB_WS_URL: ${VITE_COLLAB_WS_URL:-}
    image: sobesedovalka-frontend:local
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
