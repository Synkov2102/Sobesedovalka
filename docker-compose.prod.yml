# Прод: все переменные бэкенда — из .env.production (рядом с этим файлом на сервере).
# Не используйте ${VAR} здесь для секретов: Compose подставляет их только из .env на хосте, не из env_file.
services:
  backend:
    image: ghcr.io/synkov2102/sobesedovalka-backend:main
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    ports:
      - "8081:3000"

  frontend:
    image: ghcr.io/synkov2102/sobesedovalka-frontend:main
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
