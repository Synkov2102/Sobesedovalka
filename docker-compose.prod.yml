# На сервере: .env.production рядом с этим файлом (JWT_SECRET, MONGODB_URI, при необходимости PORT, CORS_ORIGIN).
# Секреты только в env_file — не дублируйте ${VAR:?} в environment: Compose читает .env для подстановки, не .env.production.
services:
  backend:
    image: ghcr.io/synkov2102/sobesedovalka-backend:main
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "8081:3000"

  frontend:
    image: ghcr.io/synkov2102/sobesedovalka-frontend:main
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
